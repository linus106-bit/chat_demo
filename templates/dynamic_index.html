<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenLab Chat Demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-content">
                <div class="logo">
                    <div class="logo-icon">🤖</div>
                    <h1>OpenLab Chat Demo</h1>
                </div>
                <div class="header-controls">
                    <button class="refresh-button" id="refreshButton" title="Clear all chat history">
                        <span class="refresh-icon">🔄</span>
                        Clear Chat
                    </button>
                    <div class="demo-toggle">
                        <label class="demo-switch">
                            <input type="checkbox" id="demoModeToggle">
                            <span class="demo-slider"></span>
                        </label>
                        <span class="demo-label">Demo Mode</span>
                    </div>
                </div>
            </div>
        </header>

        <main class="main-content">
            <!-- Dynamic Tabs -->
            <div class="tabs" id="dynamicTabs">
                <!-- Tabs will be populated by JavaScript -->
            </div>

            <!-- Dynamic Tab Contents -->
            <div class="tab-contents" id="dynamicTabContents">
                <!-- Tab contents will be populated by JavaScript -->
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="{{ url_for('static', path='/dynamic_script.js') }}"></script>
</body>
</html>
