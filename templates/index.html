<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diffusion Chat Demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <div class="logo">
                    <div class="logo-icon">🤖</div>
                    <h1>Diffusion Chat Demo</h1>
                </div>
                <div class="header-controls">
                    <button class="refresh-button" id="refreshButton" title="Clear all chat history">
                        <span class="refresh-icon">🔄</span>
                        Clear Chat
                    </button>
                    <div class="demo-toggle">
                        <label class="demo-switch">
                            <input type="checkbox" id="demoModeToggle" checked>
                            <span class="demo-slider"></span>
                        </label>
                        <span class="demo-label">Demo Mode</span>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Chat Area -->
        <main class="chat-container">
            <!-- Tab Navigation -->
            <div class="tab-navigation">
                <button class="tab-button active" data-tab="general">
                    <span class="tab-icon">💬</span>
                    General Chat
                </button>
                <button class="tab-button" data-tab="correction">
                    <span class="tab-icon">✏️</span>
                    Correction
                </button>
                <button class="tab-button" data-tab="extraction">
                    <span class="tab-icon">🔍</span>
                    Key Value Extraction
                </button>
            </div>

            <!-- Tab Content -->
            <div class="tab-content active" id="generalTab">
                {% include 'general.html' %}
            </div>

            <!-- Correction Tab -->
            <div class="tab-content" id="correctionTab">
                {% include 'correction.html' %}
            </div>

            <!-- Key Value Extraction Tab -->
            <div class="tab-content" id="extractionTab">
                {% include 'extraction.html' %}
            </div>
        </main>
    </div>



    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="{{ url_for('static', path='/script.js') }}"></script>
</body>
</html>
